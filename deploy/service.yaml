apiVersion: v1
kind: Service
metadata:
  name: ticket-intake-api
  labels:
    app: ticket-intake-api
spec:
  # ClusterIP for now: reachable inside the cluster (e.g. from Service B,
  # or a future Ingress). Switch to LoadBalancer or add an Ingress
  # resource once we're ready to expose this outside the cluster.
  type: ClusterIP
  selector:
    app: ticket-intake-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
